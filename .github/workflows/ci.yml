name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start production Worker and wait for readiness
        run: |
          npm run start -- --port 3001 > /tmp/vanta-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vanta-worker.log
          exit 1
      - run: npm run test:ui
        env:
          BASE_URL: http://127.0.0.1:3001
      - run: npm run test:layout
        env:
          BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: outputs/qa
