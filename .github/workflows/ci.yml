name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Start production Worker and wait for readiness
        run: |
          npm run start -- --port 3001 > /tmp/vanta-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vanta-worker.log
          exit 1
      - run: npm run test:ui
        env:
          BASE_URL: http://127.0.0.1:3001
      - name: Verify menu geometry, scrolling and focus in Chromium and WebKit
        run: node scripts/check-menu.mjs
        env:
          BASE_URL: http://127.0.0.1:3001
          MENU_BROWSERS: chromium,webkit
      - run: npm run test:layout
        env:
          BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            outputs/qa
            outputs/menu

  live:
    if: github.ref == 'refs/heads/codex/vanta-drive-revision'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://vanta-drive.furkan-akpinar.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify public routes, metadata, media and responsive pages
        run: node scripts/check-live.mjs
      - name: Exercise desktop and mobile demo journeys on the live Worker
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-qa
          path: |
            outputs/live
            outputs/qa
